name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pinned to the Foundry release the test suite is validated on; see README "Prerequisites".
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type-check frontend
        run: yarn next:check-types

      - name: Contract tests
        run: yarn foundry:test

      # The test run above compiles packages/foundry/out with the AST (foundry.toml sets ast = true); the reference
      # is generated from it, so this fails when a NatSpec change was not regenerated into docs/CONTRACT-API.md.
      - name: Contract API reference is up to date
        run: node scripts/gen-contract-api.mjs --check

      # The mainnet guard fork proof. It is part of `foundry:test` above but skips without a mainnet RPC;
      # this step runs it for real when the repo variable RUN_MAINNET_FORK is set to "true". It asserts the
      # HBAR/USDC guard OPENS on the arbitraged mainnet pool, and skips (never fails) if the RPC is unreachable.
      - name: Mainnet guard fork proof
        if: ${{ vars.RUN_MAINNET_FORK == 'true' }}
        run: yarn foundry:fork-guard

      - name: Frontend unit tests
        run: yarn next:test

      - name: Build frontend
        run: yarn next:build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: packages/nextjs

      - name: End-to-end tests (desktop and mobile, mocked network)
        run: yarn next:test:e2e

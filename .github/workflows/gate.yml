name: Template gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      is-template: ${{ steps.check.outputs.is-template }}
      package-managers: ${{ steps.check.outputs.package-managers }}
    steps:
      - uses: actions/checkout@v4
      # Scaffolded apps have no template.json (the CLI consumes it), so this workflow stays inert there.
      # The package managers come from the manifest, so this file never names them and survives the CLI's
      # npm-mode rewrite of every YAML file.
      - id: check
        run: |
          if [ -f template.json ]; then
            echo "is-template=true" >> "$GITHUB_OUTPUT"
            echo "package-managers=$(node -p 'JSON.stringify(require("./template.json")["create-scaffold-hbar"].capabilities.packageManager.filter(p => p !== "none"))')" >> "$GITHUB_OUTPUT"
          else
            echo "is-template=false" >> "$GITHUB_OUTPUT"
            echo 'package-managers=[]' >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: detect
    if: needs.detect.outputs.is-template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        framework: [foundry]
        pm: ${{ fromJSON(needs.detect.outputs.package-managers) }}
        node: [lts/*]
        # The oldest Node the engines field allows (npm).
        include:
          - { framework: foundry, pm: "npm", node: "20.18.3" }
    name: gate (${{ matrix.framework }}, ${{ matrix.pm }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The latest Foundry, as a judge scaffolding the template today would have; CI also covers v1.5.0.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gate check
        env:
          GIGET_AUTH: ${{ github.token }}
        run: >
          node scripts/gate-check.mjs
          --template ${{ github.repository }}#${{ github.sha }}
          --frameworks ${{ matrix.framework }}
          --pms ${{ matrix.pm }}

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-${{ matrix.framework }}-${{ matrix.pm }}-${{ strategy.job-index }}
          path: .gate/report.json
          if-no-files-found: ignore
